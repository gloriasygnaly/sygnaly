<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48" fill="none">
  <!-- Upper S arc: from top-right to middle-left (counterclockwise sweep) -->
  <path
    d="M 30 8 C 30 8 30 18 18 18 C 10 18 10 18 10 18"
    stroke="white" stroke-width="2.6" stroke-linecap="round" fill="none"
  />
  <!-- Lower S arc: from middle-right to bottom-left (clockwise sweep) -->
  <path
    d="M 30 30 C 30 30 10 30 10 40"
    stroke="white" stroke-width="2.6" stroke-linecap="round" fill="none"
  />
  <!-- Middle vertical connector -->
  <line x1="10" y1="18" x2="10" y2="30" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Nodes: top-right, middle-left, middle-right junction, bottom-left -->
  <circle cx="30" cy="8"  r="3.4" fill="white"/>
  <circle cx="10" cy="24" r="3.4" fill="white"/>
  <circle cx="30" cy="30" r="3.4" fill="white"/>
  <circle cx="10" cy="40" r="3.4" fill="white"/>
</svg>
